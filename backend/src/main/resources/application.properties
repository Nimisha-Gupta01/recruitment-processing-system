# Application Configuration
spring.application.name=recruitment-system
spring.profiles.active=local

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=${APP_JWT_SECRET:RecProDevSecret2026ChangeInProd!!XY}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# ── Email (update with real SMTP before demo) ─────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── CORS (React dev server) ───────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# ── Hyperspace AI (SAP internal LLM, running locally) ────────────────────────
hyperspace.api.key=${HYPERSPACE_API_KEY:}
hyperspace.base.url=${HYPERSPACE_BASE_URL:http://localhost:6655/openai/v1}
hyperspace.model=${HYPERSPACE_MODEL:gpt-4.1-mini}

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: recpro-db
    environment:
      MYSQL_ROOT_PASSWORD: RecPro2026
      MYSQL_DATABASE: recruitment_db
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docs:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pRecPro2026"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recpro-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_PASSWORD: RecPro2026
      APP_JWT_SECRET: ${APP_JWT_SECRET:-RecProDevSecret2026ChangeInProd!!XY}
      APP_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      APP_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recpro-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  uploads:

# Application Configuration
spring.application.name=recruitment-system
spring.profiles.active=local

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/recruitment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Server ────────────────────────────────────────────────────
server.port=8080

# ── JWT ───────────────────────────────────────────────────────
# Replace with a 256-bit (32+ char) secret before production
app.jwt.secret=recruitment-system-secret-key-change-in-prod-2026
app.jwt.expiration-ms=86400000

# ── Email (update with real SMTP before demo) ─────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── CORS (React dev server) ───────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# ── Hyperspace AI (SAP internal LLM, running locally) ────────────────────────
hyperspace.api.key=${HYPERSPACE_API_KEY:}
hyperspace.base.url=${HYPERSPACE_BASE_URL:http://localhost:6655/openai/v1}
hyperspace.model=${HYPERSPACE_MODEL:gpt-4.1-mini}
